<div class="list-container">
  <div class="header">
    <h2>Kategorije</h2>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      + Nova kategorija
    </button>
  </div>

  <div class="toolbar">
    <button mat-button (click)="toggleInactive()">
      {{ showInactive() ? 'Sakrij neaktivne' : 'Prikazi neaktivne' }}
    </button>
  </div>

  @if (loading()) {
    <div class="loading"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    @if (categories().length === 0) {
      <p class="empty">Nema kategorija.</p>
    } @else {
      <table mat-table [dataSource]="categories()" class="categories-table">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Naziv</th>
          <td mat-cell *matCellDef="let cat">{{ cat.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Opis</th>
          <td mat-cell *matCellDef="let cat">{{ cat.description || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let cat">
            <span class="status-badge" [class.active]="cat.isActive" [class.inactive]="!cat.isActive">
              {{ cat.isActive ? 'Aktivna' : 'Neaktivna' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Akcije</th>
          <td mat-cell *matCellDef="let cat">
            <button mat-button color="primary" (click)="openEditDialog(cat)">Izmeni</button>
            @if (cat.isActive) {
              <button mat-button color="warn" (click)="deleteCategory(cat)">Obrisi</button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  }
</div>
