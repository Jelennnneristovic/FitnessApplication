<h2 mat-dialog-title>Oceni trenera</h2>

<mat-dialog-content>
  <p class="trainer-name">{{ data.trainerName }}</p>

  <!-- Klikabilne zvezdice -->
  <div class="stars-input" (mouseleave)="clearHover()">
    @for (star of stars; track star) {
      <span
        class="star"
        [class.filled]="isStarFilled(star)"
        (click)="setRating(star)"
        (mouseenter)="setHover(star)">
        ★
      </span>
    }
  </div>

  @if (rating() > 0) {
    <p class="rating-label">Vasa ocena: {{ rating() }} / 5</p>
  } @else {
    <p class="rating-label hint">Kliknite na zvezdice da ocenite</p>
  }

  <!-- Komentar -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Komentar (opciono)</mat-label>
    <textarea matInput [(ngModel)]="comment" rows="4" placeholder="Podelite svoje iskustvo..."></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Otkazi</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="rating() === 0">
    Posalji ocenu
  </button>
</mat-dialog-actions>
